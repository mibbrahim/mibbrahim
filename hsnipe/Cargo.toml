[package]
name = "hsnipe"
version = "0.1.0"
edition = "2021"
description = "pump.fun paper/live trading bot: Powerful Bot, PowerBot, Gymer Bot"

[[bin]]
name = "hsnipe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
flate2 = "1"
futures = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "io-util"] }
yellowstone-grpc-client = "14"
yellowstone-grpc-proto = "13"
solana-pubkey = { version = "4", features = ["curve25519"] }
solana-keypair = "4"
solana-signer = "4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "abort"

[dev-dependencies]
solana-signature = { version = "3", features = ["verify"] }
